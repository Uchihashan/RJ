name: Build RJ Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rj-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build installable Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: package.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 37 platform
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Expo dependencies
        run: npx expo install --check

      - name: Run Expo Doctor
        run: npx expo-doctor

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: RJ-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
