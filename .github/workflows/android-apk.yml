name: Build RJ Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rj-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build installable Android APK with JS bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: package.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 37 platform
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ] && [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Expo dependencies
        run: npx expo install --check

      - name: Run Expo Doctor
        run: npx expo-doctor

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive

      # assembleRelease invokes the Expo/React Native Gradle bundle task,
      # packaging index.android.bundle into the APK for standalone launch.
      - name: Build release APK with embedded JavaScript bundle
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify APK and embedded JavaScript bundle
        run: |
          test -s android/app/build/outputs/apk/release/app-release.apk
          test -s android/app/build/generated/assets/createBundleReleaseJsAndAssets/index.android.bundle

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: RJ-android-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
