name: RJ Browser Demo Build

on:
  push:
    branches:
      - feature/rj-full-integration
      - feature/rj-ai-brain-completion
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-web-demo:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npm run check
      - name: Validate Expo configuration
        run: npx expo config --type public
      - name: Expo Doctor
        run: npx expo-doctor
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check Supabase Edge Functions
        run: deno check supabase/functions/rj-assistant/index.ts supabase/functions/rj-worker/index.ts supabase/functions/rj-agent-actions/index.ts && deno test supabase/functions/rj-assistant/agent-response.test.ts supabase/functions/_shared/provider-registry.test.ts supabase/functions/_shared/gemini-tts.test.ts
      - name: Test and build FFmpeg renderer worker
        working-directory: workers/rj-renderer
        run: npm install --no-audit --no-fund && npm test && npm run build
      - name: Build FFmpeg renderer Docker image
        run: docker build -t rj-renderer-ci ./workers/rj-renderer
      - name: Export browser demo
        run: npx expo export --platform web
      - name: Upload private workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: rj-browser-demo
          path: dist/
          if-no-files-found: error
          retention-days: 3

  render-free-worker:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: rj-free-render-worker
      cancel-in-progress: false
    env:
      SUPABASE_URL: "https://vxtklbtenozsluhseigp.supabase.co"
      SUPABASE_SECRET_KEY: ${{ secrets.RJ_SUPABASE_SERVER_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.RJ_SUPABASE_SERVER_KEY }}
      RJ_ONESHOT: "true"
      RJ_RENDER_BATCH_SIZE: "5"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/rj-ai-brain-completion
      - name: Verify required secrets
        run: |
          test -n "$SUPABASE_URL" || (echo "Missing Supabase URL" && exit 1)
          test -n "$SUPABASE_SECRET_KEY" || (echo "Missing RJ_SUPABASE_SERVER_KEY repository secret" && exit 1)
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install free local media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-core fontconfig ca-certificates python3 python3-venv curl espeak-ng libespeak-ng1
          sudo python3 -m venv /opt/piper-venv
          sudo /opt/piper-venv/bin/pip install --no-cache-dir piper-tts
          sudo mkdir -p /opt/piper-models
          sudo curl -fsSL "https://huggingface.co/tinisoft/piper-ta_IN-rasa_female-medium/resolve/main/ta_IN-rasa_female-medium.onnx" -o /opt/piper-models/rasa.onnx
          sudo curl -fsSL "https://huggingface.co/tinisoft/piper-ta_IN-rasa_female-medium/resolve/main/ta_IN-rasa_female-medium.onnx.json" -o /opt/piper-models/rasa.onnx.json
          sudo curl -fsSL "https://huggingface.co/Jeyaram-K/piper-tamil-voices/resolve/main/ta_IN-HemaLatha-medium/ta_IN-HemaLatha-medium.onnx" -o /opt/piper-models/hemalatha.onnx
          sudo curl -fsSL "https://huggingface.co/Jeyaram-K/piper-tamil-voices/resolve/main/ta_IN-HemaLatha-medium/ta_IN-HemaLatha-medium.onnx.json" -o /opt/piper-models/hemalatha.onnx.json
      - name: Install and build renderer
        working-directory: workers/rj-renderer
        run: npm install --no-audit --no-fund && npm run build
      - name: Process queued RJ render jobs once
        working-directory: workers/rj-renderer
        run: npm start
